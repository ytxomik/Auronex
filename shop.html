<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Auronex Store</title>

<link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

* {
    box-sizing: border-box;
}

body {

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(124,58,237,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 50%,
            rgba(168,85,247,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(124,58,237,.10),
            transparent 30%
        ),
        #050507;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
   ===================================================== */

.shop-glow {

    position: fixed;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 35%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.18),
            transparent 68%
        );

    filter: blur(20px);

    pointer-events: none;

    animation:
        shopGlow 7s ease-in-out
        infinite alternate;

    z-index: 0;
}


.shop-ring {

    position: fixed;

    width: 800px;
    height: 800px;

    left: 50%;
    top: 40%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(168,85,247,.06);

    pointer-events: none;

    animation:
        shopRotate 30s linear
        infinite;

    z-index: 0;
}


/* =====================================================
   HEADER
   ===================================================== */

.shop-header {

    position: relative;

    z-index: 20;

    width: 100%;
    height: 76px;

    display: flex;

    align-items: center;

    padding: 0 32px;

    background:
        rgba(5,5,8,.82);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:
        blur(20px);
}


.shop-brand {

    display: flex;

    align-items: center;

    gap: 10px;

    text-decoration: none;

    color: #fff;
}


.shop-brand img {

    width: 42px;
    height: 42px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 13px
            rgba(168,85,247,.75)
        );

    transition: .3s;
}


.shop-brand:hover img {

    transform: scale(1.08);

    filter:
        drop-shadow(
            0 0 23px
            rgba(168,85,247,1)
        );
}


.shop-brand span {

    font-size: 20px;

    font-weight: 900;

    letter-spacing: 3px;
}


.shop-nav {

    display: flex;

    align-items: center;

    gap: 25px;

    margin-left: auto;

    margin-right: 45px;
}


.shop-nav a {

    color: #9999a3;

    text-decoration: none;

    font-size: 14px;

    transition: .25s;
}


.shop-nav a:hover {

    color: #fff;
}


.shop-nav .active {

    color: #c084fc;
}


.profile-link {

    padding:
        9px 14px;

    border-radius:
        10px;

    background:
        rgba(124,58,237,.10);

    border:
        1px solid
        rgba(168,85,247,.20);
}


/* =====================================================
   HERO
   ===================================================== */

.shop-hero {

    position: relative;

    z-index: 5;

    min-height: 420px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        80px 20px 60px;
}


.shop-badge {

    padding:
        9px 18px;

    border-radius:
        999px;

    border:
        1px solid
        rgba(168,85,247,.35);

    background:
        rgba(124,58,237,.08);

    color:
        #c084fc;

    font-size:
        11px;

    font-weight:
        700;

    letter-spacing:
        3px;

    animation:
        shopAppear .7s ease-out;
}


.shop-hero h1 {

    margin:
        25px 0 0;

    font-size:
        clamp(70px,12vw,145px);

    line-height:
        .9;

    font-weight:
        950;

    letter-spacing:
        -6px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fff 38%,
            #c084fc
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color:
        transparent;

    animation:
        shopTitle .8s ease-out;
}


.shop-hero p {

    margin:
        30px 0 0;

    color:
        #85858e;

    font-size:
        17px;
}


/* =====================================================
   PRODUCTS
   ===================================================== */

.products {

    position: relative;

    z-index: 10;

    display: flex;

    justify-content: center;

    align-items: stretch;

    gap: 28px;

    max-width: 1200px;

    margin:
        0 auto;

    padding:
        20px 30px 120px;

    flex-wrap:
        wrap;
}


.product-card {

    position:
        relative;

    width:
        340px;

    padding:
        38px 30px;

    text-align:
        center;

    border-radius:
        27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.11);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.25);

    overflow:
        hidden;

    transition:
        transform .4s,
        border-color .4s,
        box-shadow .4s;
}


.product-card:hover {

    transform:
        translateY(-14px);

    border-color:
        rgba(192,132,252,.55);

    box-shadow:
        0 30px 80px
        rgba(124,58,237,.24);
}


.product-icon {

    position:
        relative;

    width:
        85px;

    height:
        85px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin:
        0 auto 25px;

    border-radius:
        23px;

    background:
        rgba(124,58,237,.10);

    border:
        1px solid
        rgba(168,85,247,.22);

    font-size:
        42px;
}


.product-card h2 {

    position:
        relative;

    margin:
        0 0 12px;

    font-size:
        25px;

    font-weight:
        800;
}


.product-card p {

    position:
        relative;

    min-height:
        50px;

    margin:
        0;

    color:
        #888892;

    line-height:
        1.6;

    font-size:
        14px;
}


.price {

    position:
        relative;

    margin:
        27px 0 22px;

    color:
        #c084fc;

    font-size:
        32px;

    font-weight:
        900;
}


/* =====================================================
   BUTTONS
   ===================================================== */

.product-buttons {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        10px;

    margin-top:
        20px;
}


.buy-btn,
.activate-btn {

    width:
        100%;

    min-height:
        49px;

    border:
        0;

    border-radius:
        13px;

    color:
        #fff;

    font-size:
        13px;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        .3s;
}


.buy-btn {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );

    box-shadow:
        0 10px 30px
        rgba(124,58,237,.25);
}


.buy-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(168,85,247,.42);
}


.activate-btn {

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.10);
}


.activate-btn:hover {

    border-color:
        rgba(168,85,247,.45);

    background:
        rgba(124,58,237,.10);
}


.product-version {

    margin-top:
        12px;

    color:
        #5f5f69;

    font-size:
        11px;
}


/* =====================================================
   MESSAGE
   ===================================================== */

.shop-message {

    width:
        100%;

    max-width:
        500px;

    padding:
        20px;

    text-align:
        center;

    border-radius:
        15px;

    color:
        #fca5a5;

    background:
        rgba(239,68,68,.07);

    border:
        1px solid
        rgba(239,68,68,.18);
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {

    position:
        fixed;

    inset:
        0;

    z-index:
        999;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(0,0,0,.70);

    backdrop-filter:
        blur(12px);
}


.modal.show {

    display:
        flex;
}


.modal-box {

    width:
        100%;

    max-width:
        440px;

    padding:
        30px;

    border-radius:
        22px;

    background:
        #0b0b10;

    border:
        1px solid
        rgba(168,85,247,.25);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}


.modal-box h2 {

    margin-bottom:
        10px;

    font-size:
        24px;
}


.modal-box p {

    color:
        #777782;

    font-size:
        13px;

    line-height:
        1.6;

    margin-bottom:
        20px;
}


.key-input {

    width:
        100%;

    height:
        52px;

    padding:
        0 15px;

    border-radius:
        12px;

    border:
        1px solid
        rgba(255,255,255,.10);

    outline:
        none;

    background:
        rgba(255,255,255,.04);

    color:
        #fff;

    font-family:
        monospace;

    font-size:
        14px;
}


.key-input:focus {

    border-color:
        rgba(168,85,247,.55);
}


.modal-buttons {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        10px;

    margin-top:
        15px;
}


.modal-btn {

    min-height:
        46px;

    border-radius:
        11px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.04);

    color:
        #fff;

    cursor:
        pointer;

    font-weight:
        700;
}


.modal-btn.primary {

    border:
        0;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7
        );
}


.modal-result {

    display:
        none;

    margin-top:
        15px;

    padding:
        14px;

    border-radius:
        12px;

    font-size:
        13px;
}


.modal-result.success {

    display:
        block;

    color:
        #86efac;

    background:
        rgba(34,197,94,.08);

    border:
        1px solid
        rgba(34,197,94,.15);
}


.modal-result.error {

    display:
        block;

    color:
        #fca5a5;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.15);
}


/* =====================================================
   FOOTER
   ===================================================== */

.shop-footer {

    position:
        relative;

    z-index:
        10;

    padding:
        55px 20px 45px;

    text-align:
        center;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    color:
        #4f4f58;
}


.shop-footer h3 {

    margin:
        0;

    color:
        #fff;

    font-size:
        18px;

    letter-spacing:
        3px;
}


.shop-footer p {

    margin:
        12px 0 0;

    font-size:
        13px;
}


/* =====================================================
   ANIMATIONS
   ===================================================== */

@keyframes shopGlow {

    from {

        transform:
            translate(-50%,-50%)
            scale(.85);

        opacity:
            .55;
    }

    to {

        transform:
            translate(-50%,-50%)
            scale(1.15);

        opacity:
            1;
    }
}


@keyframes shopRotate {

    from {

        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to {

        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


@keyframes shopAppear {

    from {

        opacity:
            0;

        transform:
            translateY(20px);
    }

    to {

        opacity:
            1;

        transform:
            translateY(0);
    }
}


@keyframes shopTitle {

    from {

        opacity:
            0;

        transform:
            translateY(30px)
            scale(.96);
    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px) {

    .shop-header {

        height:
            70px;

        padding:
            0 18px;
    }


    .shop-brand img {

        width:
            36px;

        height:
            36px;
    }


    .shop-brand span {

        font-size:
            17px;
    }


    .shop-nav {

        gap:
            10px;

        margin-right:
            0;
    }


    .shop-nav a {

        font-size:
            11px;
    }


    .shop-hero {

        min-height:
            360px;

        padding:
            70px 18px 45px;
    }


    .shop-hero h1 {

        font-size:
            clamp(60px,20vw,95px);

        letter-spacing:
            -4px;
    }


    .products {

        padding:
            10px 18px 80px;

        gap:
            20px;
    }


    .product-card {

        width:
            100%;

        max-width:
            380px;

        padding:
            32px 24px;
    }


    .product-buttons {

        grid-template-columns:
            1fr;
    }

}

</style>

</head>

<!-- =====================================================
     ACTIVATE KEY MODAL
     ===================================================== -->

<div
    class="modal"
    id="keyModal"
>

    <div class="modal-box">

        <h2>
            Активация ключа
        </h2>

            >
                Отмена
            </button>

                type="button"

</div>

<script>

const FUNPAY_URL =
    "https://funpay.com/users/10151898/";


let selectedProductId = null;


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =====================================================
   PRODUCT ICON
   ===================================================== */

function getProductIcon(category) {

    switch (category) {

        case "programs":
            return "💻";

        case "subscriptions":
            return "⚡";

        case "keys":
            return "🔑";

        default:
            return "🛍️";
    }
}


/* =====================================================
   LOAD LOGIN STATE
   ===================================================== */

async function loadUserState() {

    const loginLink =
        document.getElementById("loginLink");

    const registerLink =
        document.getElementById("registerLink");

    try {

        const response =
            await fetch(
                "/api/auth/me",
                {
                    method:
                        "GET",

                    credentials:
                        "same-origin",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if (
            response.ok &&
            data.ok &&
            data.user
        ) {

            if (loginLink) {

                loginLink.textContent =
                    "Кабинет";

                loginLink.href =
                    "cabinet.html";

                loginLink.classList.add(
                    "profile-link"
                );
            }


            if (registerLink) {

                registerLink.style.display =
                    "none";
            }

        }

    } catch (error) {

        console.warn(
            "Auth check error:",
            error
        );
    }
}


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts() {

    const container =
        document.getElementById(
            "products"
        );

    if (!container)
        return;


    try {

        const response =
            await fetch(
                "/api/products",
                {
                    method:
                        "GET",

                    credentials:
                        "same-origin",

                    cache:
                        "no-store"
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if (
            !response.ok ||
            !data.ok
        ) {

            throw new Error(
                data.error ||
                "Не удалось загрузить товары."
            );
        }


        const products =
            Array.isArray(
                data.products
            )
                ? data.products
                : [];


        if (!products.length) {

            container.innerHTML = `

                <div class="product-card">

                    <div class="product-icon">
                        🛒
                    </div>

                    <h2>
                        Товаров пока нет
                    </h2>

                    <p>
                        Скоро здесь появятся
                        новые цифровые товары.
                    </p>

                </div>

            `;

            return;
        }


        container.innerHTML =
            products
                .map(
                    product => {

                        const price =
                            Number(
                                product.price || 0
                            ).toLocaleString(
                                "ru-RU"
                            );


                        const icon =
                            getProductIcon(
                                product.category_slug
                            );


                        const version =
                            product.version
                                ? `
                                    <div class="product-version">
                                        Версия
                                        ${escapeHtml(
                                            product.version
                                        )}
                                    </div>
                                `
                                : "";


                        return `

                            <div
                                class="product-card"
                            >

                                <div class="product-icon">
                                    ${icon}
                                </div>

                                <h2>
                                    ${escapeHtml(
                                        product.name
                                    )}
                                </h2>

                                <p>
                                    ${escapeHtml(
                                        product.description || ""
                                    )}
                                </p>

                                <div class="price">
                                    ${price} ₽
                                </div>

                                <div class="product-buttons">

                                    <button
                                        type="button"
                                        class="buy-btn"
                                        onclick="
                                            buyProduct(
                                                ${Number(product.id)},
                                                this
                                            )
                                        "
                                    >
                                        Купить
                                    </button>

                                    <button
                                        type="button"
                                        class="activate-btn"
                                        onclick="
                                            openKeyModal(
                                                ${Number(product.id)},
                                                '${escapeHtml(product.name)}'
                                            )
                                        "
                                    >
                                        Активировать ключ
                                    </button>

                                </div>

                                ${version}

                            </div>

                        `;

                    }
                )
                .join("");


    } catch (error) {

        console.error(
            "Products error:",
            error
        );


        container.innerHTML = `

            <div class="shop-message">

                Не удалось загрузить товары.

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "Ошибка запроса."
                )}

                <br><br>

                <button
                    class="buy-btn"
                    type="button"
                    onclick="loadProducts()"
                >
                    Повторить
                </button>

            </div>

        `;
    }
}


/* =====================================================
   BUY
   ===================================================== */

function buyProduct(
    productId,
    button
) {

    /*
     * FunPay не предоставляет обычной
     * кнопке сайта возможность автоматически
     * создать заказ на стороне FunPay.
     *
     * Поэтому открываем страницу продавца.
     */

    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Открываем...";
    }


    window.open(
        FUNPAY_URL,
        "_blank",
        "noopener,noreferrer"
    );


    setTimeout(
        () => {

            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "Купить";
            }

        },
        1000
    );
}


/* =====================================================
   OPEN KEY MODAL
   ===================================================== */

function openKeyModal(
    productId,
    productName
) {

    selectedProductId =
        Number(productId);


    const modal =
        document.getElementById(
            "keyModal"
        );


    const input =
        document.getElementById(
            "keyInput"
        );


    const text =
        document.getElementById(
            "modalProductText"
        );


    const result =
        document.getElementById(
            "modalResult"
        );


    if (text) {

        text.textContent =
            `Товар: ${productName}. Введите ключ, полученный после покупки.`;
    }


    if (input) {

        input.value =
            "";

        input.focus();
    }


    if (result) {

        result.className =
            "modal-result";

        result.textContent =
            "";
    }


    if (modal) {

        modal.classList.add(
            "show"
        );
    }
}


/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeKeyModal() {

    const modal =
        document.getElementById(
            "keyModal"
        );

    if (modal) {

        modal.classList.remove(
            "show"
        );
    }

    selectedProductId =
        null;
}


/* =====================================================
   ACTIVATE KEY
   ===================================================== */

async function activateKey() {

    const input =
        document.getElementById(
            "keyInput"
        );

    const button =
        document.getElementById(
            "activateKeyButton"
        );

    const result =
        document.getElementById(
            "modalResult"
        );


    const key =
        input
            ? input.value.trim()
            : "";


    if (!selectedProductId) {

        showModalResult(
            "error",
            "Товар не выбран."
        );

        return;
    }


    if (!key) {

        showModalResult(
            "error",
            "Введите ключ."
        );

        return;
    }


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "Проверка...";
    }


    try {

        const response =
            await fetch(
                "/api/keys/activate",
                {
                    method:
                        "POST",

                    credentials:
                        "same-origin",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify(
                            {
                                key_code:
                                    key,

                                product_id:
                                    selectedProductId
                            }
                        )
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Не удалось активировать ключ."
            );
        }


        showModalResult(
            "success",
            data.message ||
            "Ключ успешно активирован!"
        );


        if (input) {

            input.value =
                "";
        }


        setTimeout(
            () => {

                window.location.href =
                    "cabinet.html";

            },
            1200
        );


    } catch (error) {

        console.error(
            "Activation error:",
            error
        );


        showModalResult(
            "error",
            error.message ||
            "Ошибка активации."
        );

    } finally {

        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Активировать";
        }
    }
}


/* =====================================================
   MODAL RESULT
   ===================================================== */

function showModalResult(
    type,
    message
) {

    const result =
        document.getElementById(
            "modalResult"
        );

    if (!result)
        return;


    result.className =
        `modal-result ${type}`;

    result.textContent =
        message;
}


/* =====================================================
   CLOSE BY BACKDROP
   ===================================================== */

document
    .getElementById("keyModal")
    ?.addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "keyModal"
            ) {

                closeKeyModal();
            }
        }
    );


/* =====================================================
   ENTER IN KEY INPUT
   ===================================================== */

document
    .getElementById("keyInput")
    ?.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                activateKey();
            }
        }
    );


/* =====================================================
   START
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadUserState();

        loadProducts();

    }
);

</script>

</body>
