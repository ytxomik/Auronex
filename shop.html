
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Auronex Store</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(124,58,237,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 50%,
                    rgba(168,85,247,.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 70%,
                    rgba(124,58,237,.10),
                    transparent 30%
                ),
                #050507;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND
           ========================= */

        .shop-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139,92,246,.18),
                    transparent 68%
                );

            filter: blur(20px);
            pointer-events: none;

            animation:
                shopGlow 7s ease-in-out infinite alternate;

            z-index: 0;
        }


        .shop-ring {
            position: fixed;
            width: 800px;
            height: 800px;
            left: 50%;
            top: 40%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(168,85,247,.06);

            pointer-events: none;

            animation:
                shopRotate 30s linear infinite;

            z-index: 0;
        }


        /* =========================
           HEADER
           ========================= */

        .shop-header {
            position: relative;
            z-index: 20;

            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;

            padding: 0 32px;

            background:
                rgba(5,5,8,.82);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(20px);
        }


        .shop-brand {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #fff;
        }


        .shop-brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 13px
                    rgba(168,85,247,.75)
                );

            transition: .3s;
        }


        .shop-brand:hover img {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 23px
                    rgba(168,85,247,1)
                );
        }


        .shop-brand span {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
        }


        .shop-nav {
            display: flex;
            align-items: center;

            gap: 25px;

            margin-left: auto;
            margin-right: 45px;
        }


        .shop-nav a {
            color: #85858e;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: .3s;
        }


        .shop-nav a:hover {
            color: #fff;
        }


        .shop-nav .active {
            color: #c084fc;
        }


        /* =========================
           HERO
           ========================= */

        .shop-hero {
            position: relative;
            z-index: 5;

            min-height: 420px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 80px 20px 60px;
        }


        .shop-badge {
            padding: 9px 18px;

            border-radius: 999px;

            border:
                1px solid
                rgba(168,85,247,.35);

            background:
                rgba(124,58,237,.08);

            color: #c084fc;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 3px;

            animation:
                shopAppear .7s ease-out;
        }


        .shop-hero h1 {
            margin: 25px 0 0;

            font-size:
                clamp(70px,12vw,145px);

            line-height: .9;

            font-weight: 950;
            letter-spacing: -6px;

            background:
                linear-gradient(
                    180deg,
                    #fff,
                    #fff 38%,
                    #c084fc
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 60px
                rgba(168,85,247,.12);

            animation:
                shopTitle .8s ease-out;
        }


        .shop-hero p {
            margin: 30px 0 0;

            color: #85858e;

            font-size: 17px;

            animation:
                shopAppear 1s ease-out;
        }


        /* =========================
           PRODUCTS
           ========================= */

        .products {
            position: relative;
            z-index: 10;

            display: flex;

            justify-content: center;
            align-items: stretch;

            gap: 28px;

            max-width: 1200px;

            margin: 0 auto;

            padding:
                20px 30px 120px;

            flex-wrap: wrap;
        }


        .product-card {
            position: relative;

            width: 340px;

            padding: 38px 30px;

            text-align: center;

            border-radius: 27px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.11);

            backdrop-filter:
                blur(22px);

            box-shadow:
                0 20px 70px
                rgba(0,0,0,.25);

            overflow: hidden;

            transition:
                transform .4s,
                border-color .4s,
                box-shadow .4s;

            animation:
                cardAppear .7s ease-out;
        }


        .product-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            left: 50%;
            top: -100px;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                rgba(168,85,247,.15);

            filter: blur(35px);

            transition: .4s;
        }


        .product-card:hover {
            transform:
                translateY(-14px);

            border-color:
                rgba(192,132,252,.55);

            box-shadow:
                0 30px 80px
                rgba(124,58,237,.24);
        }


        .product-card:hover::before {
            transform:
                translateX(-50%)
                scale(1.5);
        }


        /* =========================
           PRODUCT ICON
           ========================= */

        .product-icon {
            position: relative;

            width: 85px;
            height: 85px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 25px;

            border-radius: 23px;

            background:
                rgba(124,58,237,.10);

            border:
                1px solid
                rgba(168,85,247,.22);

            box-shadow:
                0 15px 40px
                rgba(124,58,237,.15);

            font-size: 42px;

            transition: .4s;
        }


        .product-icon img {
            width: 55px;
            height: 55px;

            object-fit: contain;
        }


        .product-card:hover .product-icon {
            transform:
                translateY(-5px)
                scale(1.06);

            box-shadow:
                0 20px 50px
                rgba(168,85,247,.28);
        }


        .product-card h2 {
            position: relative;

            margin:
                0 0 12px;

            font-size: 25px;
            font-weight: 800;
        }


        .product-card p {
            position: relative;

            min-height: 50px;

            margin: 0;

            color: #888892;

            line-height: 1.6;

            font-size: 14px;
        }


        /* =========================
           CATEGORY
           ========================= */

        .product-category {
            position: relative;

            display: inline-block;

            margin-top: 15px;

            padding: 6px 11px;

            border-radius: 999px;

            color: #c084fc;

            background:
                rgba(124,58,237,.10);

            border:
                1px solid
                rgba(168,85,247,.20);

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           PRICE
           ========================= */

        .price {
            position: relative;

            margin:
                27px 0 22px;

            color: #c084fc;

            font-size: 32px;

            font-weight: 900;

            text-shadow:
                0 0 25px
                rgba(168,85,247,.22);
        }


        /* =========================
           BUY BUTTON
           ========================= */

        .buy-btn {
            position: relative;

            width: 100%;
            height: 49px;

            border: 0;

            border-radius: 13px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(124,58,237,.25);

            transition: .3s;
        }


        .buy-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 15px 40px
                rgba(168,85,247,.42);
        }


        .buy-btn:active {
            transform:
                translateY(0);
        }


        /* =========================
           LOADING
           ========================= */

        .products-loading {
            width: 100%;

            padding: 80px 20px;

            text-align: center;

            color: #888892;
        }


        .loading-spinner {
            width: 45px;
            height: 45px;

            margin: 0 auto 20px;

            border-radius: 50%;

            border:
                3px solid
                rgba(255,255,255,.08);

            border-top-color:
                #a855f7;

            animation:
                spin 1s linear infinite;
        }


        /* =========================
           EMPTY / ERROR
           ========================= */

        .products-message {
            width: 100%;

            padding: 80px 20px;

            text-align: center;
        }


        .products-message-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }


        .products-message h2 {
            margin: 0 0 10px;

            color: #fff;
        }


        .products-message p {
            margin: 0;

            color: #888892;
        }


        /* =========================
           FOOTER
           ========================= */

        .shop-footer {
            position: relative;
            z-index: 10;

            padding:
                55px 20px 45px;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            color: #4f4f58;
        }


        .shop-footer h3 {
            margin: 0;

            color: #fff;

            font-size: 18px;

            letter-spacing: 3px;
        }


        .shop-footer p {
            margin:
                12px 0 0;

            font-size: 13px;
        }


        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes shopGlow {

            from {
                transform:
                    translate(-50%,-50%)
                    scale(.85);

                opacity: .55;
            }

            to {
                transform:
                    translate(-50%,-50%)
                    scale(1.15);

                opacity: 1;
            }
        }


        @keyframes shopRotate {

            from {
                transform:
                    translate(-50%,-50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%,-50%)
                    rotate(360deg);
            }
        }


        @keyframes shopAppear {

            from {
                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes shopTitle {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .shop-header {
                height: 70px;
                padding: 0 18px;
            }


            .shop-brand img {
                width: 36px;
                height: 36px;
            }


            .shop-brand span {
                font-size: 17px;
            }


            .shop-nav {
                gap: 12px;
                margin-right: 15px;
            }


            .shop-nav a {
                font-size: 12px;
            }


            .shop-hero {
                min-height: 360px;

                padding:
                    70px 18px 45px;
            }


            .shop-hero h1 {
                font-size:
                    clamp(60px,20vw,95px);

                letter-spacing: -4px;
            }


            .shop-hero p {
                font-size: 15px;
            }


            .products {
                padding:
                    10px 18px 80px;

                gap: 20px;
            }


            .product-card {
                width: 100%;

                max-width: 380px;

                padding:
                    32px 24px;
            }

        }

    </style>

</head>


<body>


<div class="shop-glow"></div>

<div class="shop-ring"></div>


<header class="shop-header">

    <a
        href="index.html"
        class="shop-brand"
    >

        <img
            src="assets/logo.png"
            alt="Auronex"
        >

        <span>
            AURONEX
        </span>

    </a>


    <nav class="shop-nav">

        <a href="index.html">
            Главная
        </a>

        <a
            href="shop.html"
            class="active"
        >
            Магазин
        </a>

        <a href="login.html">
            Войти
        </a>

        <a href="register.html">
            Регистрация
        </a>

    </nav>

</header>


<section class="shop-hero">

    <div class="shop-badge">
        AURONEX STORE
    </div>


    <h1>
        STORE
    </h1>


    <p>
        Цифровые товары нового поколения
    </p>

</section>


<section
    class="products"
    id="products"
>

    <div class="products-loading">

        <div class="loading-spinner"></div>

        <div>
            Загрузка товаров...
        </div>

    </div>

</section>


<footer class="shop-footer">

    <h3>
        AURONEX
    </h3>

    <p>
        Digital Marketplace © 2026
    </p>

</footer>


<script src="js/app.js"></script>


<script>

async function loadProducts() {

    const container =
        document.getElementById("products");

    if (!container) {
        return;
    }


    try {

        const response =
            await fetch("/api/products", {
                method: "GET",
                credentials: "same-origin",
                headers: {
                    "Accept": "application/json"
                }
            });


        const data =
            await response
                .json()
                .catch(() => ({}));


        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Не удалось загрузить товары."
            );

        }


        const products =
            Array.isArray(data.products)
                ? data.products.filter(
                    product => product.active !== false
                )
                : [];


        if (products.length === 0) {

            container.innerHTML = `

                <div class="products-message">

                    <div class="products-message-icon">
                        🛒
                    </div>

                    <h2>
                        Товаров пока нет
                    </h2>

                    <p>
                        Новые товары скоро появятся.
                    </p>

                </div>

            `;

            return;
        }


        container.innerHTML =
            products
                .map(product => {

                    const price =
                        Number(product.price)
                            .toLocaleString("ru-RU");


                    const image =
                        product.image_url
                            ? `
                                <img
                                    src="${escapeHtml(product.image_url)}"
                                    alt="${escapeHtml(product.name)}"
                                >
                              `
                            : "💻";


                    return `

                        <div
                            class="product-card"
                            data-product-id="${escapeHtml(product.id)}"
                        >

                            <div class="product-icon">
                                ${image}
                            </div>


                            <h2>
                                ${escapeHtml(product.name)}
                            </h2>


                            <p>
                                ${escapeHtml(
                                    product.description ||
                                    "Цифровой товар Auronex."
                                )}
                            </p>


                            ${
                                product.category_name
                                    ? `
                                        <div class="product-category">
                                            ${escapeHtml(
                                                product.category_name
                                            )}
                                        </div>
                                      `
                                    : ""
                            }


                            <div class="price">
                                ${price} ₽
                            </div>


                            <button
                                class="buy-btn"
                                type="button"
                                onclick="buyProduct(${Number(product.id)})"
                            >
                                Купить
                            </button>

                        </div>

                    `;

                })
                .join("");


    } catch (error) {

        console.error(
            "Auronex products error:",
            error
        );


        container.innerHTML = `

            <div class="products-message">

                <div class="products-message-icon">
                    ⚠️
                </div>

                <h2>
                    Не удалось загрузить товары
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


function buyProduct(productId) {

    window.location.href =
        "product.html?id=" +
        encodeURIComponent(productId);

}


document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);

</script>


</body>

</html>
```
