
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вход — Auronex</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(124,58,237,.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(168,85,247,.10),
                    transparent 30%
                ),
                #050507;

            overflow-x: hidden;
        }


        /* =========================================
           BACKGROUND
           ========================================= */

        .background-glow {
            position: fixed;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139,92,246,.16),
                    transparent 68%
                );

            filter: blur(30px);

            pointer-events: none;

            animation:
                glowMove 8s ease-in-out
                infinite alternate;
        }


        .background-ring {
            position: fixed;

            width: 850px;
            height: 850px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(168,85,247,.06);

            pointer-events: none;

            animation:
                ringRotate 30s linear infinite;
        }


        /* =========================================
           HEADER
           ========================================= */

        .header {
            position: relative;

            z-index: 20;

            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;

            padding: 0 32px;

            background:
                rgba(5,5,8,.82);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(20px);
        }


        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            color: #fff;

            text-decoration: none;
        }


        .brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(168,85,247,.75)
                );

            transition: .3s;
        }


        .brand:hover img {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 24px
                    rgba(168,85,247,1)
                );
        }


        .brand-name {
            font-size: 20px;

            font-weight: 900;

            letter-spacing: 3px;
        }


        .nav {
            display: flex;
            align-items: center;

            gap: 25px;

            margin-left: auto;

            margin-right: 60px;
        }


        .nav a {
            color: #9999a3;

            text-decoration: none;

            font-size: 14px;

            transition: .25s;
        }


        .nav a:hover {
            color: #fff;
        }


        .nav .active {
            color: #c084fc;
        }


        /* =========================================
           PAGE
           ========================================= */

        .page {
            position: relative;

            z-index: 5;

            min-height:
                calc(100vh - 76px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                65px 20px 90px;
        }


        /* =========================================
           LOGIN CARD
           ========================================= */

        .login-card {
            position: relative;

            width: 100%;

            max-width: 460px;

            padding: 42px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,.45);

            overflow: hidden;

            animation:
                cardAppear .7s ease-out;
        }


        .login-card::before {
            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            left: 50%;
            top: -170px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(168,85,247,.18);

            filter: blur(45px);

            pointer-events: none;
        }


        /* =========================================
           ICON
           ========================================= */

        .login-icon {
            position: relative;

            width: 76px;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin:
                0 auto 22px;

            border-radius: 22px;

            background:
                rgba(124,58,237,.10);

            border:
                1px solid
                rgba(168,85,247,.25);

            box-shadow:
                0 15px 40px
                rgba(124,58,237,.15);

            font-size: 34px;
        }


        .login-card h1 {
            position: relative;

            text-align: center;

            font-size: 32px;

            font-weight: 900;

            margin-bottom: 10px;
        }


        .description {
            position: relative;

            text-align: center;

            color: #85858f;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================================
           MESSAGE
           ========================================= */

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 11px;

            font-size: 12px;

            line-height: 1.5;
        }


        .message.error {
            display: block;

            color: #fca5a5;

            background:
                rgba(239,68,68,.08);

            border:
                1px solid
                rgba(239,68,68,.18);
        }


        .message.success {
            display: block;

            color: #86efac;

            background:
                rgba(34,197,94,.08);

            border:
                1px solid
                rgba(34,197,94,.18);
        }


        /* =========================================
           FORM
           ========================================= */

        .form-group {
            margin-bottom: 19px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #d4d4d8;

            font-size: 13px;

            font-weight: 700;
        }


        .input-wrap {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #777782;

            font-size: 16px;

            pointer-events: none;
        }


        .form-group input {
            width: 100%;

            height: 52px;

            padding:
                0 16px 0 45px;

            border-radius: 13px;

            outline: none;

            color: #fff;

            background:
                rgba(0,0,0,.22);

            border:
                1px solid
                rgba(255,255,255,.10);

            font-size: 14px;

            transition: .25s;
        }


        .form-group input::placeholder {
            color: #55555f;
        }


        .form-group input:focus {
            border-color:
                rgba(168,85,247,.75);

            background:
                rgba(124,58,237,.055);

            box-shadow:
                0 0 0 4px
                rgba(168,85,247,.08);
        }


        /* =========================================
           PASSWORD
           ========================================= */

        .password-input {
            padding-right: 48px !important;
        }


        .password-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: #777782;

            cursor: pointer;

            font-size: 15px;

            padding: 5px;
        }


        .password-toggle:hover {
            color: #c084fc;
        }


        /* =========================================
           OPTIONS
           ========================================= */

        .options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin:
                5px 0 25px;
        }


        .remember {
            display: flex;

            align-items: center;

            gap: 8px;

            color: #777782;

            font-size: 12px;

            cursor: pointer;
        }


        .remember input {
            width: 16px;
            height: 16px;

            accent-color: #8b5cf6;

            cursor: pointer;
        }


        .forgot {
            color: #b47cff;

            text-decoration: none;

            font-size: 12px;

            transition: .2s;
        }


        .forgot:hover {
            color: #d8b4fe;

            text-decoration: underline;
        }


        /* =========================================
           BUTTON
           ========================================= */

        .login-button {
            width: 100%;

            height: 53px;

            border: 0;

            border-radius: 14px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 35px
                rgba(124,58,237,.25);

            transition: .3s;
        }


        .login-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 18px 45px
                rgba(168,85,247,.42);
        }


        .login-button:active {
            transform:
                translateY(0);
        }


        /* =========================================
           REGISTER
           ========================================= */

        .register-link {
            margin-top: 25px;

            text-align: center;

            color: #70707a;

            font-size: 13px;
        }


        .register-link a {
            color: #c084fc;

            text-decoration: none;

            font-weight: 700;
        }


        .register-link a:hover {
            text-decoration: underline;
        }


        /* =========================================
           ANIMATIONS
           ========================================= */

        @keyframes glowMove {

            from {
                transform:
                    translate(-50%,-50%)
                    scale(.85);

                opacity: .55;
            }

            to {
                transform:
                    translate(-50%,-50%)
                    scale(1.15);

                opacity: 1;
            }
        }


        @keyframes ringRotate {

            from {
                transform:
                    translate(-50%,-50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%,-50%)
                    rotate(360deg);
            }
        }


        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 700px) {

            .header {
                height: 70px;

                padding:
                    0 18px;
            }


            .brand img {
                width: 36px;
                height: 36px;
            }


            .brand-name {
                font-size: 17px;
            }


            .nav {
                display: none;
            }


            .page {
                padding:
                    40px 16px 70px;
            }


            .login-card {
                padding:
                    32px 22px;

                border-radius: 24px;
            }


            .login-card h1 {
                font-size: 27px;
            }


            .options {
                gap: 10px;
            }

        }

    </style>

</head>


<body>


<div class="background-glow"></div>

<div class="background-ring"></div>



<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">


    <a
        href="index.html"
        class="brand"
    >

        <img
            src="assets/logo.png"
            alt="Auronex"
        >

        <span class="brand-name">
            AURONEX
        </span>

    </a>


    <nav class="nav">

        <a href="index.html">
            Главная
        </a>

        <a href="shop.html">
            Магазин
        </a>

        <a
            href="login.html"
            class="active"
        >
            Войти
        </a>

        <a href="register.html">
            Регистрация
        </a>

    </nav>


</header>



<!-- =====================================================
     LOGIN
     ===================================================== -->

<main class="page">


    <section class="login-card">


        <div class="login-icon">
            🔐
        </div>


        <h1>
            С возвращением
        </h1>


        <p class="description">
            Войдите в свой аккаунт Auronex,
            чтобы продолжить.
        </p>


        <div
            id="message"
            class="message"
        ></div>



        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email или имя пользователя
            </label>

            <div class="input-wrap">

                <span class="input-icon">
                    👤
                </span>

                <input
                    id="email"
                    type="text"
                    placeholder="Введите Email или логин"
                    autocomplete="username"
                >

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Пароль
            </label>

            <div class="input-wrap">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    id="password"
                    class="password-input"
                    type="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    onclick="togglePassword()"
                    aria-label="Показать пароль"
                >
                    👁
                </button>

            </div>

        </div>



        <!-- OPTIONS -->

        <div class="options">

            <label class="remember">

                <input
                    id="remember"
                    type="checkbox"
                >

                Запомнить меня

            </label>


            <a
                href="#"
                class="forgot"
                onclick="forgotPassword(event)"
            >
                Забыли пароль?
            </a>

        </div>



        <!-- LOGIN BUTTON -->

        <button
            id="loginButton"
            class="login-button"
            type="button"
            onclick="loginUser()"
        >
            Войти
        </button>



        <!-- REGISTER -->

        <div class="register-link">

            Нет аккаунта?

            <a href="register.html">
                Создать аккаунт
            </a>

        </div>


    </section>


</main>



<script>

    /*
     * FRONTEND-ВЕРСИЯ
     *
     * Реальная авторизация будет подключена
     * после добавления backend + базы данных.
     */


    function togglePassword() {

        const input =
            document.getElementById(
                "password"
            );

        const button =
            document.querySelector(
                ".password-toggle"
            );


        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";

        }

    }



    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent = text;

        message.className =
            "message " + type;

    }



    function loginUser() {

        const login =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        if (!login) {

            showMessage(
                "Введите Email или имя пользователя.",
                "error"
            );

            return;
        }


        if (!password) {

            showMessage(
                "Введите пароль.",
                "error"
            );

            return;
        }


        /*
         * Здесь позже будет настоящий запрос
         * к серверу:
         *
         * POST /api/login
         *
         * После успешного входа:
         *
         * window.location.href =
         * "cabinet.html";
         */


        showMessage(
            "Форма готова. Реальную авторизацию подключим на следующем этапе.",
            "success"
        );

    }



    function forgotPassword(event) {

        event.preventDefault();


        showMessage(
            "Восстановление пароля подключим вместе с backend.",
            "success"
        );

    }

</script>


</body>

</html>
```
