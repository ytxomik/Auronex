
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — Auronex</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(124,58,237,.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(168,85,247,.10),
                    transparent 30%
                ),
                #050507;

            overflow-x: hidden;
        }


        /* ================================================
           BACKGROUND
           ================================================ */

        .background-glow {
            position: fixed;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139,92,246,.16),
                    transparent 68%
                );

            filter: blur(30px);

            pointer-events: none;

            animation:
                glowMove 8s ease-in-out
                infinite alternate;
        }


        .background-ring {
            position: fixed;

            width: 850px;
            height: 850px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(168,85,247,.06);

            pointer-events: none;

            animation:
                ringRotate 30s linear infinite;
        }


        /* ================================================
           HEADER
           ================================================ */

        .header {
            position: relative;

            z-index: 20;

            height: 76px;

            display: flex;
            align-items: center;

            padding: 0 32px;

            background:
                rgba(5,5,8,.82);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(20px);
        }


        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            color: #fff;

            text-decoration: none;
        }


        .brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(168,85,247,.75)
                );

            transition: .3s;
        }


        .brand:hover img {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 24px
                    rgba(168,85,247,1)
                );
        }


        .brand-name {
            font-size: 20px;

            font-weight: 900;

            letter-spacing: 3px;
        }


        .nav {
            display: flex;

            align-items: center;

            gap: 25px;

            margin-left: auto;

            margin-right: 60px;
        }


        .nav a {
            color: #9999a3;

            text-decoration: none;

            font-size: 14px;

            transition: .25s;
        }


        .nav a:hover {
            color: #fff;
        }


        .nav .active {
            color: #c084fc;
        }


        /* ================================================
           PAGE
           ================================================ */

        .page {
            position: relative;

            z-index: 5;

            min-height:
                calc(100vh - 76px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                70px 20px 100px;
        }


        /* ================================================
           REGISTER CARD
           ================================================ */

        .register-card {
            position: relative;

            width: 100%;

            max-width: 470px;

            padding: 42px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,.45);

            animation:
                cardAppear .7s ease-out;

            overflow: hidden;
        }


        .register-card::before {
            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            left: 50%;
            top: -170px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                rgba(168,85,247,.18);

            filter: blur(45px);

            pointer-events: none;
        }


        /* ================================================
           CARD HEADER
           ================================================ */

        .register-icon {
            position: relative;

            width: 76px;
            height: 76px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 22px;

            border-radius: 22px;

            background:
                rgba(124,58,237,.10);

            border:
                1px solid
                rgba(168,85,247,.25);

            box-shadow:
                0 15px 40px
                rgba(124,58,237,.15);

            font-size: 34px;
        }


        .register-card h1 {
            position: relative;

            text-align: center;

            font-size: 32px;

            font-weight: 900;

            margin-bottom: 10px;
        }


        .register-description {
            position: relative;

            text-align: center;

            color: #85858f;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 32px;
        }


        /* ================================================
           FORM
           ================================================ */

        .form-group {
            margin-bottom: 19px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #d4d4d8;

            font-size: 13px;

            font-weight: 700;
        }


        .input-wrap {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #777782;

            font-size: 16px;

            pointer-events: none;
        }


        .form-group input {
            width: 100%;

            height: 51px;

            padding:
                0 16px 0 45px;

            border-radius: 13px;

            outline: none;

            color: #fff;

            background:
                rgba(0,0,0,.22);

            border:
                1px solid
                rgba(255,255,255,.10);

            font-size: 14px;

            transition: .25s;
        }


        .form-group input::placeholder {
            color: #55555f;
        }


        .form-group input:focus {
            border-color:
                rgba(168,85,247,.75);

            background:
                rgba(124,58,237,.055);

            box-shadow:
                0 0 0 4px
                rgba(168,85,247,.08);
        }


        /* ================================================
           PASSWORD
           ================================================ */

        .password-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: #777782;

            cursor: pointer;

            font-size: 15px;

            padding: 5px;
        }


        .password-toggle:hover {
            color: #c084fc;
        }


        .password-input {
            padding-right: 48px !important;
        }


        /* ================================================
           PASSWORD STRENGTH
           ================================================ */

        .password-strength {
            display: flex;

            gap: 5px;

            margin-top: 9px;
        }


        .strength-line {
            height: 3px;

            flex: 1;

            border-radius: 10px;

            background:
                rgba(255,255,255,.08);

            transition: .3s;
        }


        .strength-text {
            margin-top: 7px;

            color: #666671;

            font-size: 11px;
        }


        /* ================================================
           CHECKBOX
           ================================================ */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin:
                22px 0;
        }


        .terms input {
            width: 17px;
            height: 17px;

            margin-top: 1px;

            accent-color: #8b5cf6;

            cursor: pointer;
        }


        .terms label {
            color: #777782;

            font-size: 12px;

            line-height: 1.5;

            cursor: pointer;
        }


        .terms a {
            color: #b47cff;

            text-decoration: none;
        }


        .terms a:hover {
            text-decoration: underline;
        }


        /* ================================================
           REGISTER BUTTON
           ================================================ */

        .register-button {
            width: 100%;

            height: 53px;

            border: 0;

            border-radius: 14px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 35px
                rgba(124,58,237,.25);

            transition: .3s;
        }


        .register-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 18px 45px
                rgba(168,85,247,.42);
        }


        .register-button:active {
            transform:
                translateY(0);
        }


        .register-button:disabled {
            opacity: .55;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* ================================================
           LOGIN LINK
           ================================================ */

        .login-link {
            margin-top: 25px;

            text-align: center;

            color: #70707a;

            font-size: 13px;
        }


        .login-link a {
            color: #c084fc;

            text-decoration: none;

            font-weight: 700;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* ================================================
           EMAIL VERIFICATION
           ================================================ */

        .verification {
            display: none;

            animation:
                fadeIn .4s ease;
        }


        .verification.active {
            display: block;
        }


        .verification-title {
            text-align: center;

            font-size: 22px;

            font-weight: 800;

            margin-bottom: 10px;
        }


        .verification-text {
            text-align: center;

            color: #85858f;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .verification-email {
            color: #c084fc;

            font-weight: 700;
        }


        .code-input {
            width: 100%;

            height: 62px;

            text-align: center;

            letter-spacing: 12px;

            padding-left: 20px !important;

            font-size: 24px !important;

            font-weight: 800;
        }


        .resend {
            margin-top: 18px;

            text-align: center;

            color: #686872;

            font-size: 12px;
        }


        .resend button {
            border: 0;

            background: transparent;

            color: #c084fc;

            cursor: pointer;

            font-size: 12px;
        }


        /* ================================================
           ERROR / SUCCESS
           ================================================ */

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 11px;

            font-size: 12px;

            line-height: 1.5;
        }


        .message.error {
            display: block;

            color: #fca5a5;

            background:
                rgba(239,68,68,.08);

            border:
                1px solid
                rgba(239,68,68,.18);
        }


        .message.success {
            display: block;

            color: #86efac;

            background:
                rgba(34,197,94,.08);

            border:
                1px solid
                rgba(34,197,94,.18);
        }


        /* ================================================
           ANIMATIONS
           ================================================ */

        @keyframes glowMove {

            from {
                transform:
                    translate(-50%,-50%)
                    scale(.85);

                opacity: .55;
            }

            to {
                transform:
                    translate(-50%,-50%)
                    scale(1.15);

                opacity: 1;
            }
        }


        @keyframes ringRotate {

            from {
                transform:
                    translate(-50%,-50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%,-50%)
                    rotate(360deg);
            }
        }


        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* ================================================
           MOBILE
           ================================================ */

        @media (max-width: 700px) {

            .header {
                height: 70px;

                padding:
                    0 18px;
            }


            .brand img {
                width: 36px;
                height: 36px;
            }


            .brand-name {
                font-size: 17px;
            }


            .nav {
                display: none;
            }


            .page {
                padding:
                    40px 16px 70px;
            }


            .register-card {
                padding:
                    32px 22px;

                border-radius: 24px;
            }


            .register-card h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="background-glow"></div>

<div class="background-ring"></div>



<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">


    <a
        href="index.html"
        class="brand"
    >

        <img
            src="assets/logo.png"
            alt="Auronex"
        >

        <span class="brand-name">
            AURONEX
        </span>

    </a>


    <nav class="nav">

        <a href="index.html">
            Главная
        </a>

        <a href="shop.html">
            Магазин
        </a>

        <a href="login.html">
            Войти
        </a>

        <a
            href="register.html"
            class="active"
        >
            Регистрация
        </a>

    </nav>


</header>



<!-- =====================================================
     REGISTER PAGE
     ===================================================== -->

<main class="page">


    <section class="register-card">


        <!-- =============================================
             REGISTRATION
             ============================================= -->

        <div id="registrationForm">


            <div class="register-icon">
                👤
            </div>


            <h1>
                Создать аккаунт
            </h1>


            <p class="register-description">
                Зарегистрируйтесь в Auronex,
                чтобы получить доступ к личному кабинету.
            </p>


            <div
                id="message"
                class="message"
            ></div>



            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Имя пользователя
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        id="username"
                        type="text"
                        placeholder="Введите имя пользователя"
                        autocomplete="username"
                        maxlength="32"
                    >

                </div>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        id="password"
                        class="password-input"
                        type="password"
                        placeholder="Придумайте пароль"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Показать пароль"
                    >
                        👁
                    </button>

                </div>


                <div class="password-strength">

                    <div class="strength-line"></div>
                    <div class="strength-line"></div>
                    <div class="strength-line"></div>
                    <div class="strength-line"></div>

                </div>


                <div
                    id="strengthText"
                    class="strength-text"
                >
                    Введите пароль
                </div>

            </div>



            <!-- PASSWORD CONFIRM -->

            <div class="form-group">

                <label for="passwordConfirm">
                    Повторите пароль
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        🔐
                    </span>

                    <input
                        id="passwordConfirm"
                        class="password-input"
                        type="password"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('passwordConfirm', this)"
                        aria-label="Показать пароль"
                    >
                        👁
                    </button>

                </div>

            </div>



            <!-- TERMS -->

            <div class="terms">

                <input
                    id="terms"
                    type="checkbox"
                >

                <label for="terms">

                    Я принимаю
                    <a href="#">
                        условия использования
                    </a>
                    и
                    <a href="#">
                        политику конфиденциальности
                    </a>.

                </label>

            </div>



            <!-- BUTTON -->

            <button
                id="registerButton"
                class="register-button"
                type="button"
                onclick="registerUser()"
            >
                Создать аккаунт
            </button>


            <div class="login-link">

                Уже есть аккаунт?

                <a href="login.html">
                    Войти
                </a>

            </div>


        </div>



        <!-- =============================================
             EMAIL VERIFICATION
             ============================================= -->

        <div
            id="verificationForm"
            class="verification"
        >


            <div class="register-icon">
                ✉️
            </div>


            <div class="verification-title">
                Подтвердите Email
            </div>


            <p class="verification-text">

                Мы отправили код подтверждения
                на адрес

                <span
                    id="verificationEmail"
                    class="verification-email"
                >
                </span>

                <br>

                Введите его ниже.

            </p>


            <div
                id="verificationMessage"
                class="message"
            ></div>


            <div class="form-group">

                <input
                    id="verificationCode"
                    class="code-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="000000"
                    autocomplete="one-time-code"
                >

            </div>


            <button
                class="register-button"
                type="button"
                onclick="verifyCode()"
            >
                Подтвердить Email
            </button>


            <div class="resend">

                Не получили код?

                <button
                    type="button"
                    onclick="resendCode()"
                >
                    Отправить снова
                </button>

            </div>


        </div>


    </section>


</main>



<script>

    /*
     * Сейчас это FRONTEND-ЗАГОТОВКА.
     *
     * Здесь НЕ сохраняются реальные пароли
     * и НЕ отправляются реальные письма.
     *
     * Следующим этапом подключим backend,
     * базу данных и настоящий email-код.
     */


    const passwordInput =
        document.getElementById("password");


    const strengthLines =
        document.querySelectorAll(".strength-line");


    const strengthText =
        document.getElementById("strengthText");



    /* ================================================
       PASSWORD STRENGTH
       ================================================ */

    passwordInput.addEventListener(
        "input",
        function () {

            const password =
                passwordInput.value;

            let strength = 0;


            if (password.length >= 8) {
                strength++;
            }

            if (/[A-Z]/.test(password)) {
                strength++;
            }

            if (/[0-9]/.test(password)) {
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                strength++;
            }


            strengthLines.forEach(
                function (line, index) {

                    if (index < strength) {

                        line.style.background =
                            strength <= 1
                                ? "#ef4444"
                                : strength === 2
                                    ? "#f59e0b"
                                    : "#a855f7";

                    } else {

                        line.style.background =
                            "rgba(255,255,255,.08)";
                    }

                }
            );


            if (!password) {

                strengthText.textContent =
                    "Введите пароль";

            } else if (strength === 1) {

                strengthText.textContent =
                    "Слабый пароль";

            } else if (strength === 2) {

                strengthText.textContent =
                    "Средний пароль";

            } else if (strength === 3) {

                strengthText.textContent =
                    "Хороший пароль";

            } else {

                strengthText.textContent =
                    "Надёжный пароль";
            }

        }
    );



    /* ================================================
       SHOW / HIDE PASSWORD
       ================================================ */

    function togglePassword(
        inputId,
        button
    ) {

        const input =
            document.getElementById(inputId);


        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁";
        }

    }



    /* ================================================
       MESSAGE
       ================================================ */

    function showMessage(
        element,
        text,
        type
    ) {

        element.textContent = text;

        element.className =
            "message " + type;

    }



    /* ================================================
       REGISTRATION
       ================================================ */

    function registerUser() {

        const username =
            document.getElementById(
                "username"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const passwordConfirm =
            document.getElementById(
                "passwordConfirm"
            ).value;


        const terms =
            document.getElementById(
                "terms"
            ).checked;


        const message =
            document.getElementById(
                "message"
            );



        if (username.length < 3) {

            showMessage(
                message,
                "Имя пользователя должно содержать минимум 3 символа.",
                "error"
            );

            return;
        }


        if (!email.includes("@")) {

            showMessage(
                message,
                "Введите корректный Email.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                message,
                "Пароль должен содержать минимум 8 символов.",
                "error"
            );

            return;
        }


        if (password !== passwordConfirm) {

            showMessage(
                message,
                "Пароли не совпадают.",
                "error"
            );

            return;
        }


        if (!terms) {

            showMessage(
                message,
                "Необходимо принять условия использования.",
                "error"
            );

            return;
        }



        /*
         * Пока имитируем переход
         * к подтверждению Email.
         *
         * Реальную отправку кода подключим
         * через backend.
         */


        document.getElementById(
            "verificationEmail"
        ).textContent = email;


        document.getElementById(
            "registrationForm"
        ).style.display = "none";


        document.getElementById(
            "verificationForm"
        ).classList.add("active");

    }



    /* ================================================
       VERIFY CODE
       ================================================ */

    function verifyCode() {

        const code =
            document.getElementById(
                "verificationCode"
            ).value.trim();


        const message =
            document.getElementById(
                "verificationMessage"
            );


        if (!/^\d{6}$/.test(code)) {

            showMessage(
                message,
                "Введите шестизначный код.",
                "error"
            );

            return;
        }


        /*
         * Реальная проверка кода будет
         * выполняться на сервере.
         */


        showMessage(
            message,
