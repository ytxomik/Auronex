
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — Auronex</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(124, 58, 237, .22),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(88, 28, 135, .15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(168, 85, 247, .10),
                    transparent 28%
                ),
                #050507;

            overflow-x: hidden;
        }


        /* ==================================================
           BACKGROUND
           ================================================== */

        .background-glow {
            position: fixed;

            width: 600px;
            height: 600px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, .18),
                    transparent 68%
                );

            filter: blur(20px);

            pointer-events: none;

            animation:
                glowMove 8s ease-in-out infinite alternate;
        }


        .background-circle {
            position: fixed;

            width: 700px;
            height: 700px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(168, 85, 247, .06);

            box-shadow:
                0 0 120px
                rgba(124, 58, 237, .08);

            pointer-events: none;

            animation:
                rotateCircle 25s linear infinite;
        }


        /* ==================================================
           HEADER
           ================================================== */

        .site-header {
            position: relative;

            z-index: 20;

            width: 100%;
            height: 76px;

            display: flex;

            align-items: center;

            padding: 0 32px;

            background:
                rgba(5, 5, 8, .78);

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }


        .brand {
            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            text-decoration: none;
        }


        .brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(139,92,246,.75)
                );

            transition: .3s;
        }


        .brand:hover img {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 22px
                    rgba(168,85,247,1)
                );
        }


        .brand-text {
            font-size: 20px;

            font-weight: 900;

            letter-spacing: 3px;

            color: #fff;
        }


        .main-nav {
            display: flex;

            align-items: center;

            gap: 28px;

            margin-left: 50px;
        }


        .main-nav a {
            color: #a1a1aa;

            text-decoration: none;

            font-size: 14px;

            transition: .25s;
        }


        .main-nav a:hover {
            color: #fff;
        }


        .header-actions {
            display: flex;

            align-items: center;

            gap: 9px;

            margin-left: auto;
        }


        .login-btn,
        .register-btn {
            height: 40px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 0 16px;

            border-radius: 11px;

            text-decoration: none;

            font-size: 14px;

            transition: .3s;
        }


        .login-btn {
            color: #fff;

            border:
                1px solid
                rgba(255,255,255,.13);

            background:
                rgba(255,255,255,.04);
        }


        .login-btn:hover {
            border-color: #a855f7;

            background:
                rgba(168,85,247,.09);
        }


        .register-btn {
            color: #fff;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            box-shadow:
                0 8px 25px
                rgba(124,58,237,.28);
        }


        .register-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 35px
                rgba(168,85,247,.45);
        }


        /* ==================================================
           MAIN
           ================================================== */

        .register-page {
            position: relative;

            z-index: 5;

            min-height:
                calc(100vh - 76px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                70px 20px 90px;
        }


        /* ==================================================
           CARD
           ================================================== */

        .register-card {
            position: relative;

            width: 100%;

            max-width: 500px;

            padding: 42px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.45),
                0 0 70px
                rgba(124,58,237,.10);

            animation:
                cardAppear .7s ease-out;
        }


        .register-card::before {
            content: "";

            position: absolute;

            inset: -1px;

            border-radius: 28px;

            padding: 1px;

            background:
                linear-gradient(
                    135deg,
                    rgba(192,132,252,.30),
                    transparent 35%,
                    transparent 65%,
                    rgba(124,58,237,.18)
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite:
                xor;

            mask-composite: exclude;

            pointer-events: none;
        }


        /* ==================================================
           CARD HEADER
           ================================================== */

        .register-logo {
            width: 70px;
            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 20px;

            background:
                rgba(124,58,237,.10);

            border:
                1px solid
                rgba(168,85,247,.25);

            box-shadow:
                0 15px 40px
                rgba(124,58,237,.18);
        }


        .register-logo img {
            width: 50px;
            height: 50px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(168,85,247,.8)
                );
        }


        .register-title {
            margin: 0;

            text-align: center;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: -.5px;

            background:
                linear-gradient(
                    180deg,
                    #fff,
                    #d8b4fe
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .register-description {
            margin:
                12px auto 32px;

            max-width: 390px;

            text-align: center;

            color: #8f8f99;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ==================================================
           FORM
           ================================================== */

        .register-form {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .field {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .field label {
            color: #d4d4d8;

            font-size: 13px;

            font-weight: 600;
        }


        .input-wrap {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #71717a;

            font-size: 16px;

            pointer-events: none;
        }


        .field input {
            width: 100%;

            height: 50px;

            padding:
                0 15px 0 43px;

            border-radius: 13px;

            outline: none;

            color: #fff;

            background:
                rgba(0,0,0,.25);

            border:
                1px solid
                rgba(255,255,255,.10);

            font-size: 14px;

            transition: .3s;
        }


        .field input::placeholder {
            color: #55555f;
        }


        .field input:hover {
            border-color:
                rgba(168,85,247,.25);
        }


        .field input:focus {
            border-color:
                rgba(168,85,247,.75);

            background:
                rgba(124,58,237,.055);

            box-shadow:
                0 0 0 3px
                rgba(168,85,247,.09),
                0 0 25px
                rgba(124,58,237,.10);
        }


        /* ==================================================
           TERMS
           ================================================== */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin-top: 2px;
        }


        .terms input {
            width: 17px;
            height: 17px;

            margin-top: 1px;

            accent-color: #a855f7;

            cursor: pointer;
        }


        .terms label {
            color: #777781;

            font-size: 12px;

            line-height: 1.5;

            cursor: pointer;
        }


        .terms a {
            color: #c084fc;

            text-decoration: none;
        }


        .terms a:hover {
            text-decoration: underline;
        }


        /* ==================================================
           REGISTER BUTTON
           ================================================== */

        .create-account {
            width: 100%;

            height: 53px;

            margin-top: 4px;

            border: 0;

            border-radius: 14px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 35px
                rgba(124,58,237,.28);

            transition: .3s;
        }


        .create-account:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 17px 45px
                rgba(168,85,247,.45);
        }


        .create-account:active {
            transform:
                translateY(0);
        }


        /* ==================================================
           LOGIN LINK
           ================================================== */

        .already-account {
            margin:
                24px 0 0;

            text-align: center;

            color: #71717a;

            font-size: 13px;
        }


        .already-account a {
            color: #c084fc;

            text-decoration: none;

            font-weight: 600;
        }


        .already-account a:hover {
            color: #d8b4fe;

            text-decoration: underline;
        }


        /* ==================================================
           FOOTER
           ================================================== */

        .page-footer {
            position: relative;

            z-index: 5;

            padding:
                0 20px 30px;

            text-align: center;

            color: #44444c;

            font-size: 12px;
        }


        /* ==================================================
           ANIMATIONS
           ================================================== */

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes glowMove {

            from {
                transform:
                    translate(-50%, -50%)
                    scale(.85);

                opacity: .65;
            }

            to {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: 1;
            }
        }


        @keyframes rotateCircle {

            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }
        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 700px) {

            .site-header {
                height: 70px;

                padding:
                    0 18px;
            }


            .main-nav {
                display: none;
            }


            .header-actions {
                margin-left: auto;
            }


            .login-btn,
            .register-btn {
                height: 37px;

                padding:
                    0 11px;

                font-size: 12px;
            }


            .brand img {
                width: 36px;
                height: 36px;
            }


            .brand-text {
                font-size: 17px;
            }


            .register-page {
                min-height:
                    calc(100vh - 70px);

                padding:
                    45px 15px 60px;
            }


            .register-card {
                padding:
                    30px 22px;

                border-radius: 23px;
            }


            .register-title {
                font-size: 29px;
            }


            .register-logo {
                width: 62px;
                height: 62px;
            }


            .register-logo img {
                width: 44px;
                height: 44px;
            }

        }

    </style>

</head>


<body>


<!-- ======================================================
     BACKGROUND
     ====================================================== -->

<div class="background-glow"></div>

<div class="background-circle"></div>



<!-- ======================================================
     HEADER
     ====================================================== -->

<header class="site-header">


    <a
        href="index.html"
        class="brand"
    >

        <img
            src="assets/logo.png"
            alt="Auronex"
        >

        <span class="brand-text">
            AURONEX
        </span>

    </a>


    <nav class="main-nav">

        <a href="index.html">
            Главная
        </a>

        <a href="shop.html">
            Магазин
        </a>

        <a href="login.html">
            Войти
        </a>

    </nav>


    <div class="header-actions">

        <a
            href="login.html"
            class="login-btn"
        >
            Войти
        </a>

        <a
            href="register.html"
            class="register-btn"
        >
            Регистрация
        </a>

    </div>

</header>



<!-- ======================================================
     REGISTRATION
     ====================================================== -->

<main class="register-page">


    <section class="register-card">


        <!-- ЛОГО -->

        <div class="register-logo">

            <img
                src="assets/logo.png"
                alt="Auronex"
            >

        </div>


        <!-- ЗАГОЛОВОК -->

        <h1 class="register-title">
            Создать аккаунт
        </h1>


        <p class="register-description">
            Зарегистрируйтесь в Auronex,
            чтобы покупать цифровые товары,
            управлять покупками и получать
            доступ к своему аккаунту.
        </p>



        <!-- ФОРМА -->

        <form
            class="register-form"
            id="registerForm"
        >


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Имя пользователя
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        @
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Введите имя пользователя"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>



            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        @
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@mail.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Пароль
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ●
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Минимум 8 символов"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="field">

                <label for="confirmPassword">
                    Повторите пароль
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ●
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Повторите пароль"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>

            </div>



            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >

                <label for="terms">
                    Я принимаю
                    <a href="#">
                        правила использования
                    </a>
                    Auronex
                </label>

            </div>



            <!-- BUTTON -->

            <button
                type="submit"
                class="create-account"
                id="registerBtn"
            >
                Создать аккаунт
            </button>


        </form>



        <!-- LOGIN -->

        <p class="already-account">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </p>


    </section>

</main>



<!-- ======================================================
     FOOTER
     ====================================================== -->

<footer class="page-footer">

    © 2026 Auronex

</footer>



</body>

</html>
```
