<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Auronex</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">AURONEX</div>

    <nav>
        <a href="index.html">Главная</a>
        <a href="shop.html">Магазин</a>
        <a href="login.html">Войти</a>
    </nav>
</header>


<main class="auth-page">

    <div class="auth-glow"></div>

    <div class="auth-card">

        <div class="auth-icon">✦</div>

        <div class="badge">AURONEX ACCOUNT</div>

        <h1>Создать аккаунт</h1>

        <p class="auth-description">
            Зарегистрируйтесь, чтобы покупать цифровые товары
            и управлять своими покупками.
        </p>


        <form id="registerForm">

            <label for="username">
                Имя пользователя
            </label>

            <input
                id="username"
                name="username"
                type="text"
                placeholder="Введите имя"
                minlength="3"
                maxlength="24"
                autocomplete="username"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="example@mail.com"
                autocomplete="email"
                required
            >


            <label for="password">
                Пароль
            </label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Минимум 8 символов"
                minlength="8"
                autocomplete="new-password"
                required
            >


            <label for="passwordConfirm">
                Повторите пароль
            </label>

            <input
                id="passwordConfirm"
                name="passwordConfirm"
                type="password"
                placeholder="Повторите пароль"
                minlength="8"
                autocomplete="new-password"
                required
            >


            <label class="terms">

                <input
                    id="terms"
                    type="checkbox"
                    required
                >

                <span>
                    Я принимаю правила использования Auronex
                </span>

            </label>


            <button
                type="submit"
                class="auth-button"
            >
                Создать аккаунт
            </button>

        </form>


        <div
            id="registerMessage"
            class="auth-message"
        ></div>


        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
