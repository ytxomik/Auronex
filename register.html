
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Auronex</title>
<link rel="icon" type="image/png" href="assets/logo.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 10%,rgba(124,58,237,.18),transparent 35%),
        radial-gradient(circle at 10% 80%,rgba(168,85,247,.10),transparent 30%),
        #050507;
    overflow-x:hidden;
}

.background-glow{
    position:fixed;
    width:650px;
    height:650px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,.16),transparent 68%);
    filter:blur(30px);
    pointer-events:none;
    animation:glowMove 8s ease-in-out infinite alternate;
}

.background-ring{
    position:fixed;
    width:850px;
    height:850px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(168,85,247,.06);
    pointer-events:none;
    animation:ringRotate 30s linear infinite;
}

.header{
    position:relative;
    z-index:20;
    height:76px;
    display:flex;
    align-items:center;
    padding:0 32px;
    background:rgba(5,5,8,.82);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(20px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
    text-decoration:none;
}

.brand img{
    width:42px;
    height:42px;
    object-fit:contain;
    filter:drop-shadow(0 0 14px rgba(168,85,247,.75));
}

.brand-name{
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

.nav{
    display:flex;
    align-items:center;
    gap:25px;
    margin-left:auto;
    margin-right:60px;
}

.nav a{
    color:#9999a3;
    text-decoration:none;
    font-size:14px;
    transition:.25s;
}

.nav a:hover{color:#fff}
.nav .active{color:#c084fc}

.page{
    position:relative;
    z-index:5;
    min-height:calc(100vh - 76px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px 90px;
}

.card{
    width:100%;
    max-width:470px;
    padding:42px;
    border-radius:30px;
    background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(25px);
    box-shadow:0 35px 100px rgba(0,0,0,.45);
    animation:cardAppear .7s ease-out;
}

.icon{
    width:76px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 22px;
    border-radius:22px;
    background:rgba(124,58,237,.10);
    border:1px solid rgba(168,85,247,.25);
    font-size:34px;
}

h1{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:10px;
}

.description{
    text-align:center;
    color:#85858f;
    font-size:14px;
    line-height:1.6;
    margin-bottom:30px;
}

.form-group{margin-bottom:18px}

label{
    display:block;
    margin-bottom:8px;
    color:#d4d4d8;
    font-size:13px;
    font-weight:700;
}

.input-wrap{position:relative}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:#777782;
}

input{
    width:100%;
    height:51px;
    padding:0 45px;
    border-radius:13px;
    outline:none;
    color:#fff;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.10);
    font-size:14px;
    transition:.25s;
}

input::placeholder{color:#55555f}

input:focus{
    border-color:rgba(168,85,247,.75);
    box-shadow:0 0 0 4px rgba(168,85,247,.08);
}

.password-toggle{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#777782;
    cursor:pointer;
}

.strength{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.strength span{
    height:3px;
    flex:1;
    border-radius:10px;
    background:rgba(255,255,255,.08);
}

.strength-text{
    margin-top:6px;
    color:#666671;
    font-size:11px;
}

.terms{
    display:flex;
    gap:10px;
    margin:20px 0;
}

.terms input{
    width:17px;
    height:17px;
    padding:0;
    accent-color:#8b5cf6;
}

.terms label{
    color:#777782;
    font-size:12px;
    line-height:1.5;
}

.terms a,
.login-link a{
    color:#c084fc;
    text-decoration:none;
}

.button{
    width:100%;
    height:53px;
    border:0;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 12px 35px rgba(124,58,237,.25);
    transition:.3s;
}

.button:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 45px rgba(168,85,247,.42);
}

.login-link{
    margin-top:24px;
    text-align:center;
    color:#70707a;
    font-size:13px;
}

.message{
    display:none;
    margin-bottom:18px;
    padding:12px 14px;
    border-radius:11px;
    font-size:12px;
}

.message.error{
    display:block;
    color:#fca5a5;
    background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.18);
}

.message.success{
    display:block;
    color:#86efac;
    background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.18);
}

.verification{display:none}
.verification.active{display:block}

.verify-text{
    text-align:center;
    color:#85858f;
    font-size:13px;
    line-height:1.6;
    margin-bottom:25px;
}

.code{
    text-align:center;
    letter-spacing:12px;
    font-size:24px;
    font-weight:800;
    padding-left:25px;
}

@keyframes glowMove{
    from{transform:translate(-50%,-50%) scale(.85);opacity:.55}
    to{transform:translate(-50%,-50%) scale(1.15);opacity:1}
}

@keyframes ringRotate{
    from{transform:translate(-50%,-50%) rotate(0)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes cardAppear{
    from{opacity:0;transform:translateY(30px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:700px){
    .header{height:70px;padding:0 18px}
    .brand img{width:36px;height:36px}
    .brand-name{font-size:17px}
    .nav{display:none}
    .page{padding:40px 16px 70px}
    .card{padding:32px 22px;border-radius:24px}
    h1{font-size:27px}
}
</style>
</head>

<body>

<div class="background-glow"></div>
<div class="background-ring"></div>

<header class="header">
<a href="index.html" class="brand">
    <img src="assets/logo.png" alt="Auronex">
    <span class="brand-name">AURONEX</span>
</a>

<nav class="nav">
    <a href="index.html">Главная</a>
    <a href="shop.html">Магазин</a>
    <a href="login.html">Войти</a>
    <a href="register.html" class="active">Регистрация</a>
</nav>
</header>

<main class="page">

<section class="card">

<div id="registration">

    <div class="icon">👤</div>

    <h1>Создать аккаунт</h1>

    <p class="description">
        Зарегистрируйтесь в Auronex,
        чтобы получить доступ к личному кабинету.
    </p>

    <div id="message" class="message"></div>

    <div class="form-group">
        <label>Имя пользователя</label>
        <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input id="username"
                   type="text"
                   placeholder="Введите имя пользователя"
                   maxlength="32">
        </div>
    </div>

    <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input id="email"
                   type="email"
                   placeholder="you@example.com">
        </div>
    </div>

    <div class="form-group">
        <label>Пароль</label>
        <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input id="password"
                   type="password"
                   placeholder="Придумайте пароль">
            <button type="button"
                    class="password-toggle"
                    onclick="togglePassword('password',this)">
                👁
            </button>
        </div>

        <div class="strength">
            <span></span><span></span><span></span><span></span>
        </div>

        <div id="strengthText" class="strength-text">
            Введите пароль
        </div>
    </div>

    <div class="form-group">
        <label>Повторите пароль</label>
        <div class="input-wrap">
            <span class="input-icon">🔐</span>
            <input id="passwordConfirm"
                   type="password"
                   placeholder="Повторите пароль">
            <button type="button"
                    class="password-toggle"
                    onclick="togglePassword('passwordConfirm',this)">
                👁
            </button>
        </div>
    </div>

    <div class="terms">
        <input id="terms" type="checkbox">
        <label for="terms">
            Я принимаю
            <a href="#">условия использования</a>
            и
            <a href="#">политику конфиденциальности</a>.
        </label>
    </div>

    <button class="button"
            onclick="registerUser()">
        Создать аккаунт
    </button>

    <div class="login-link">
        Уже есть аккаунт?
        <a href="login.html">Войти</a>
    </div>

</div>

<div id="verification" class="verification">

    <div class="icon">✉️</div>

    <h1>Подтвердите Email</h1>

    <p class="verify-text">
        Для тестирования введите любой
        шестизначный код.<br>
        Email: <strong id="verifyEmail"></strong>
    </p>

    <div id="verifyMessage" class="message"></div>

    <div class="form-group">
        <input id="verifyCode"
               class="code"
               maxlength="6"
               inputmode="numeric"
               placeholder="000000">
    </div>

    <button class="button" onclick="verifyCode()">
        Подтвердить Email
    </button>

</div>

</section>

</main>

<script>

const password = document.getElementById("password");

password.addEventListener("input", function(){

    const value = password.value;
    const lines = document.querySelectorAll(".strength span");

    let strength = 0;

    if(value.length >= 8) strength++;
    if(/[A-Z]/.test(value)) strength++;
    if(/[0-9]/.test(value)) strength++;
    if(/[^A-Za-z0-9]/.test(value)) strength++;

    lines.forEach((line,index)=>{
        line.style.background =
            index < strength
            ? "#a855f7"
            : "rgba(255,255,255,.08)";
    });

    const text = document.getElementById("strengthText");

    if(!value) text.textContent="Введите пароль";
    else if(strength <= 1) text.textContent="Слабый пароль";
    else if(strength === 2) text.textContent="Средний пароль";
    else if(strength === 3) text.textContent="Хороший пароль";
    else text.textContent="Надёжный пароль";
});


function togglePassword(id,button){

    const input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
        button.textContent="🙈";
    }else{
        input.type="password";
        button.textContent="👁";
    }
}


function showMessage(element,text,type){

    element.textContent=text;
    element.className="message "+type;
}


function registerUser(){

    const username=document
        .getElementById("username")
        .value.trim();

    const email=document
        .getElementById("email")
        .value.trim()
        .toLowerCase();

    const pass=document
        .getElementById("password")
        .value;

    const confirm=document
        .getElementById("passwordConfirm")
        .value;

    const terms=document
        .getElementById("terms")
        .checked;

    const message=document
        .getElementById("message");


    if(username.length < 3){
        showMessage(message,
            "Имя пользователя должно содержать минимум 3 символа.",
            "error");
        return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        showMessage(message,
            "Введите корректный Email.",
            "error");
        return;
    }

    if(pass.length < 8){
        showMessage(message,
            "Пароль должен содержать минимум 8 символов.",
            "error");
        return;
    }

    if(pass !== confirm){
        showMessage(message,
            "Пароли не совпадают.",
            "error");
        return;
    }

    if(!terms){
        showMessage(message,
            "Необходимо принять условия использования.",
            "error");
        return;
    }


    const oldUser=JSON.parse(
        localStorage.getItem("auronex_user")
    );

    if(oldUser &&
       (oldUser.email===email ||
        oldUser.username.toLowerCase()===username.toLowerCase())){

        showMessage(message,
            "Пользователь с таким Email или именем уже существует.",
            "error");
        return;
    }


    const user={
        username:username,
        email:email,
        password:pass,
        emailVerified:false,
        createdAt:new Date().toISOString(),
        purchases:[],
        keys:[],
        spent:0
    };


    localStorage.setItem(
        "auronex_user",
        JSON.stringify(user)
    );


    document.getElementById("verifyEmail")
        .textContent=email;

    document.getElementById("registration")
        .style.display="none";

    document.getElementById("verification")
        .classList.add("active");
}


function verifyCode(){

    const code=document
        .getElementById("verifyCode")
        .value.trim();

    const message=document
        .getElementById("verifyMessage");


    if(!/^\d{6}$/.test(code)){
        showMessage(
            message,
            "Введите шестизначный код.",
            "error"
        );
        return;
    }


    const user=JSON.parse(
        localStorage.getItem("auronex_user")
    );


    if(!user){
        showMessage(
            message,
            "Аккаунт не найден.",
            "error"
        );
        return;
    }


    user.emailVerified=true;


    localStorage.setItem(
        "auronex_user",
        JSON.stringify(user)
    );


    showMessage(
        message,
        "Email подтверждён! Переходим ко входу...",
        "success"
    );


    setTimeout(()=>{
        window.location.href="login.html";
    },1000);
}

</script>

</body>
</html>
```
