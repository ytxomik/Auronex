```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Auronex</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <!-- Анимированный фон -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
    </div>


    <!-- Верхняя панель -->
    <header class="auth-header">

        <a href="index.html" class="brand">
            <img src="assets/logo.png" alt="Auronex">
        </a>

        <nav class="auth-nav">
            <a href="index.html">Главная</a>
            <a href="shop.html">Магазин</a>
            <a href="#">Поддержка</a>
        </nav>

        <div class="header-actions">
            <a href="login.html" class="login-btn">
                Войти
            </a>

            <a href="register.html" class="register-top-btn">
                Регистрация
            </a>
        </div>

    </header>


    <!-- Основная часть -->
    <main class="register-page">

        <!-- Левая часть -->
        <section class="register-intro">

            <div class="intro-label">
                AURONEX ACCOUNT
            </div>

            <h1>
                Создайте аккаунт
                <span>Auronex</span>
            </h1>

            <p>
                Получите доступ к цифровым товарам,
                управляйте покупками и активируйте
                свои ключи.
            </p>

        </section>


        <!-- Карточка регистрации -->
        <section class="register-card">

            <div class="form-icon">
                ✦
            </div>

            <div class="form-title">
                <h2>Регистрация</h2>

                <p>
                    Создайте свой аккаунт Auronex
                </p>
            </div>


            <form id="registerForm">

                <!-- Имя -->
                <div class="input-group">

                    <label for="username">
                        Имя пользователя
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◇
                        </span>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            placeholder="Введите имя пользователя"
                            minlength="3"
                            maxlength="24"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            @
                        </span>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="example@mail.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- Пароль -->
                <div class="input-group">

                    <label for="password">
                        Пароль
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◈
                        </span>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Минимум 8 символов"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Показать пароль"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- Повтор пароля -->
                <div class="input-group">

                    <label for="passwordConfirm">
                        Повторите пароль
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ◈
                        </span>

                        <input
                            id="passwordConfirm"
                            name="passwordConfirm"
                            type="password"
                            placeholder="Повторите пароль"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="passwordConfirm"
                            aria-label="Показать пароль"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- Правила -->
                <label class="terms">

                    <input
                        id="terms"
                        type="checkbox"
                        required
                    >

                    <span>
                        Я принимаю
                        <a href="#">
                            правила использования
                        </a>
                        Auronex
                    </span>

                </label>


                <!-- Кнопка -->
                <button
                    type="submit"
                    class="create-account-btn"
                >
                    <span>
                        Создать аккаунт
                    </span>

                    <b>→</b>
                </button>


                <div
                    id="registerMessage"
                    class="register-message"
                ></div>

            </form>


            <!-- Вход -->
            <div class="already-account">

                <span>
                    Уже есть аккаунт?
                </span>

                <a href="login.html">
                    Войти
                </a>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
```
